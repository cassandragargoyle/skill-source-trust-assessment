name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Validate fixtures
        run: python skills/source-trust-assessment/scripts/validate_assessment.py tests/fixtures/valid/*.json

      - name: Validate vocabulary
        run: |
          pip install rdflib
          python -c "import rdflib; g = rdflib.Graph(); g.parse('skills/source-trust-assessment/assets/vocabulary.ttl', format='turtle'); print(len(g), 'triples')"
